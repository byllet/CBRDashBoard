openapi: 3.0.0
info:
  title: CBR Analytics API
  version: 1.0.0
  description: API для получения экономических метрик (курсы валют, ставки, агрегаты и др.)

paths:
  /api/metrics:
    get:
      summary: Получить экономические метрики
      description: |
        Возвращает рассчитанные метрики по указанному параметру.
        Поддерживаются различные операции (среднее, сумма, минимум, максимум и др.)
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum:
              - currency_rates
              - credits_stats
              - money_aggregates
              - deposit_rates
              - loan_rates
          description: Название экономического параметра (соответствует `parameter_name` в БД)
        - name: operation
          in: query
          schema:
            type: string
            enum:
              - avg
              - sum
              - min
              - max
              - count
          description: Агрегатная операция над значениями метрики
        - name: region
          in: query
          schema:
            type: string
          description: Название региона (соответствует `region_name` в БД). Если не указан — данные по всем регионам.
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Начальная дата в формате YYYY-MM-DD
          example: "2024-01-01"
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Конечная дата в формате YYYY-MM-DD
          example: "2024-12-31"
      responses:
        '200':
          description: Успешный ответ с метриками
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    oneOf:
                      - type: object
                        additionalProperties: true
                        description: Рассчитанное значение метрики (для одной операции)
                      - type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              format: date
                            value:
                              type: number
                            region:
                              type: string
                        description: Детализированные данные с разбивкой по датам
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "metric is required"
        '404':
          description: Данные не найдены для указанных параметров
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  metrics:
                    type: 'null'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Failed to retrieve metrics"

  /health:
    get:
      summary: Проверка состояния сервиса
      responses:
        '200':
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  timestamp:
                    type: string
                    format: date-time