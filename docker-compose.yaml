version: "3.8"

services:
  database:
    build: 
      context: ./database
    container_name: ${DB_CONTAINER_NAME}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
    - "${DB_PORT}:5432"
    networks:
    - ${NETWORK_NAME}
    restart: unless-stopped

  etl-service:
    build:
      context: ./etl_service
    container_name: ${ETL_CONTAINER_NAME}
    environment:
      PORT: ${ETL_PORT}
      DB_HOST: ${DB_CONTAINER_NAME}
      DB_PORT: ${DB_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    ports:
    - "${ETL_PORT}:${ETL_PORT}"
    networks:
    - ${NETWORK_NAME}
    depends_on:
    - database

  backend:
    build:
      context: ./backend
    container_name: ${BACKEND_CONTAINER_NAME}
    environment:
      PORT: ${BACKEND_PORT}
      DB_HOST: ${DB_CONTAINER_NAME}
      DB_PORT: ${DB_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      ETL_SERVICE_URL: http://${ETL_CONTAINER_NAME}:${ETL_PORT}
    ports:
    - "${BACKEND_PORT}:15001"
    networks:
    - ${NETWORK_NAME}
    depends_on:
    - database
    - etl-service

  frontend:
    build:
      context: ./frontend
    container_name: ${FRONTEND_CONTAINER_NAME}
    environment:
      PORT: ${FRONTEND_PORT}
      BACKEND_URL: http://${BACKEND_CONTAINER_NAME}:${BACKEND_PORT}
    ports:
    - "${FRONTEND_PORT}:80"
    networks:
      - ${NETWORK_NAME}
    depends_on:
      - backend

networks:
  cbr-network:
    name: ${NETWORK_NAME}
    external: false
